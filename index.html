<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday! Pick Your Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#e9eff9;--dot:rgba(42,63,224,.16);--card:#fffdf6;--text:#16205b;--muted:#5a6498;--edge:#16205b;--shadow:#16205b;
--blue:#2a3fe0;--red:#f2483b;--yellow:#ffd23f;--link:#2a3fe0;--c1:#ffd23f;--c2:#a9b6ff;--c3:#ff9c92;--c4:#8fe3c0;
--display:"Bagel Fat One","Arial Black","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#0e1233;--dot:rgba(169,182,255,.14);--card:#1a2163;--text:#f6f1e4;--muted:#b3bbe8;--edge:#f6f1e4;--shadow:#04061a;--link:#a9b6ff}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#0e1233;--dot:rgba(169,182,255,.14);--card:#1a2163;--text:#f6f1e4;--muted:#b3bbe8;--edge:#f6f1e4;--shadow:#04061a;--link:#a9b6ff}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;overflow-x:hidden;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.8px);background-size:16px 16px;color:var(--text);font-family:var(--body);line-height:1.5}
main{max-width:720px;margin:0 auto;padding:26px 16px 28px}
main:not(.wide){padding-top:7vh}
main.wide{max-width:980px}
.center{text-align:center}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn{background:var(--red);color:#fff;border:3px solid var(--edge);padding:14px 30px;border-radius:999px;font-family:var(--display);font-size:20px;letter-spacing:.01em;box-shadow:5px 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow)}
.link{background:none;border:0;color:var(--link);font-weight:700;padding:8px;font-size:16px}
#go{grid-column:1/-1;grid-row:4;justify-self:center;position:relative;z-index:2;margin:4px 0;background:var(--blue)}
.lead{font-size:19px;max-width:30em;margin:22px auto 22px;font-weight:500}
/* hero collage */
.collage{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:18px 14px;align-items:center;margin:14px 0 6px}
.collage::before{content:"";position:absolute;left:51%;top:36%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--red);z-index:0}
.collage::after{content:"";position:absolute;top:-30px;right:-6px;width:78px;aspect-ratio:1;background:var(--blue);z-index:3;transform:rotate(14deg);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ph{position:relative;z-index:1;width:100%;height:auto;display:block;object-fit:cover;background:#fffdf6;border:6px solid #fffdf6;outline:2.5px solid var(--edge);border-radius:4px;box-shadow:6px 6px 0 var(--blue)}
.p2,.p5{box-shadow:6px 6px 0 var(--red)}
.p3,.p6{box-shadow:6px 6px 0 var(--shadow)}
.p1{grid-column:1/-1;grid-row:1;aspect-ratio:2/1;transform:translate(-2px,2px) rotate(-2.5deg)}
.p5{grid-column:1/span 5;grid-row:2;aspect-ratio:3/4;object-position:50% 22%;transform:translate(3px,-5px) rotate(-5deg)}
.p2{grid-column:6/span 7;grid-row:2;aspect-ratio:4/3;transform:translate(-3px,3px) rotate(3.5deg)}
.banner{grid-column:1/-1;grid-row:3;position:relative;z-index:2;margin:-4px -4px;transform:rotate(-1.5deg);filter:drop-shadow(5px 5px 0 var(--shadow))}
.p3{grid-column:1/span 4;grid-row:5;aspect-ratio:3/4;object-position:50% 33%;transform:translate(-3px,2px) rotate(4deg)}
.p4{grid-column:5/span 8;grid-row:5;aspect-ratio:4/3;object-position:56% 50%;transform:translate(2px,-4px) rotate(-2.5deg)}
.p6{grid-column:1/span 6;grid-row:6;aspect-ratio:1;object-position:50% 22%;transform:translate(4px,1px) rotate(-4deg)}
.p7{grid-column:7/span 6;grid-row:6;aspect-ratio:1;object-position:50% 45%;transform:translate(-2px,-3px) rotate(3.5deg)}
.banner h1{margin:0;padding:30px 24px;background:var(--yellow);color:#16205b;font-family:var(--display);font-weight:400;font-size:clamp(18px,5.5vw,40px);line-height:1.08;letter-spacing:-.02em;white-space:nowrap;text-align:center;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%,22px 50%)}
@media(min-width:760px){
.collage{display:block;aspect-ratio:4/2.55;margin-top:24px}
.collage::before{left:52%;top:38%;width:41%}
.ph{position:absolute;width:auto;aspect-ratio:auto;object-position:50% 50%}
.p5{left:-13%;top:-3%;width:18%;transform:rotate(7deg)}
.p1{left:17%;top:-4%;width:30%;transform:rotate(3deg)}
.p2{left:59%;top:1%;width:27%;transform:rotate(-5deg)}
.p3{left:94%;top:1%;width:15%;transform:rotate(7deg)}
.banner{position:absolute;left:16%;top:30%;width:68%;margin:0}
.banner h1{padding:30px 34px;font-size:clamp(24px,2.8vw,36px)}
.p6{left:-8%;top:47%;width:18%;transform:rotate(-6deg)}
.p4{left:32%;top:67%;width:35%;transform:rotate(4deg)}
#go{position:absolute;left:50%;top:52%;transform:translateX(-50%);margin:0;white-space:nowrap}
#go:hover{transform:translate(calc(-50% - 1px),-1px)}
#go:active{transform:translate(calc(-50% + 4px),4px)}
.p7{left:89%;top:52%;width:16%;transform:rotate(-5deg)}}
/* questions */
.dots{display:flex;gap:10px;justify-content:center;margin:6px 0 28px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--edge);background:var(--card)}
.dots i.done{background:var(--blue)}
.dots i.cur{background:var(--yellow);transform:scale(1.3)}
.q{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.q{animation:none}.btn,.opt{transition:none}}
.q h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6.5vw,40px);line-height:1.1;margin:0 0 6px;text-align:center;text-wrap:balance}
.q .sub{text-align:center;color:var(--muted);margin:0 0 24px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.opt{background:var(--card);color:var(--text);border:3px solid var(--edge);border-radius:22px 6px 22px 6px;padding:18px 12px 16px;text-align:center;box-shadow:5px 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s,background .12s}
.opt:nth-child(even){border-radius:6px 22px 6px 22px}
.opt:hover{transform:translate(-2px,-2px) rotate(-.8deg);box-shadow:7px 7px 0 var(--shadow)}
.opt .e{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 8px;border-radius:50%;border:2.5px solid var(--edge);background:var(--c1);font-size:34px}
.opt:nth-child(4n+2) .e{background:var(--c2)}.opt:nth-child(4n+3) .e{background:var(--c3)}.opt:nth-child(4n+4) .e{background:var(--c4)}
.opt b{display:block;font-size:17px;line-height:1.25}
.opt small{display:none}
.opt.on{background:var(--yellow);color:#16205b;transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow)}
.opt.on .e{background:#fffdf6}
.nav{display:flex;justify-content:space-between;margin-top:24px}
/* summary ticket */
.final{background:var(--yellow);color:#16205b;border:3px solid var(--edge);border-radius:6px;padding:26px 22px;text-align:center;box-shadow:9px 9px 0 var(--shadow);transform:rotate(-.6deg)}
.final h2{color:#16205b}
.final ul{list-style:none;padding:0;margin:16px 0 20px;text-align:left}
.final li{padding:12px 6px;border-bottom:2.5px dashed rgba(22,32,91,.45);cursor:pointer;font-weight:700;font-size:18px}
.final li span{display:block;font-weight:500;font-size:14px;opacity:.7}
.final .link{color:#16205b;text-decoration:underline}
.final .big{font-size:44px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
#msg{margin-top:14px;font-size:15px;white-space:pre-wrap;text-align:left;background:#fffdf6;border:2.5px solid #16205b;border-radius:6px;padding:12px}
#msg:empty{display:none}
.saved{font-size:13px;color:var(--muted);margin-top:18px;text-align:center;min-height:20px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
</style>
</head>

var S={picks:{},idx:-1,locked:false}, app=document.getElementById('app'), dbDoc=null;
function act(){return STEPS.map(function(s,i){return i}).filter(function(i){var s=STEPS[i];return !s.off&&(s.when===undefined||S.picks[0]===s.when)&&(s.and===undefined||S.picks[s.and[0]]===s.and[1])})}
function nxt(i,d){var a=act(),p=a.indexOf(i)+d;return p<0?-1:(a[p]===undefined?STEPS.length:a[p])}

/* ---- saving: shared db when available, localStorage as backup ---- */
function save(){
  var d={v:14,picks:S.picks,locked:S.locked,updated:new Date().toISOString()};
  try{localStorage.setItem('bday',JSON.stringify(d))}catch(e){}
  if(dbDoc){dbDoc.set(d).then(function(){note('Saved ✓')}).catch(function(){note('Saved on this device ✓')})}
  else note('Saved on this device ✓');
}
function note(t){document.getElementById('saved').textContent=t}
function apply(d){
  if(!d||!d.picks||d.v!==14)return;
  S.picks=d.picks;S.locked=!!d.locked;
  var n=Object.keys(S.picks).length;
  var f=act().filter(function(i){return S.picks[i]===undefined})[0];S.idx=f===undefined?STEPS.length:f;
  if(n===0&&!S.locked)S.idx=-1;
}

  }
}catch(e){}

/* ---- rendering ---- */
function dots(){
  return '<div class="dots">'+act().map(function(i){
    return '<i class="'+(S.picks[i]!==undefined?'done':'')+(i===S.idx?' cur':'')+'"></i>'}).join('')+'</div>';
}
function render(){
  var h='';
  if(S.idx<0){
    h='<div class="center"><div class="collage">'+ph(0,'p1')+ph(1,'p2')+ph(2,'p3')+'<div class="banner"><h1>🎂 Happy Birthday '+NAME+'! 🎉</h1></div><button class="btn" id="go">Plan my day 🎉</button>'+ph(3,'p4')+ph(4,'p5')+ph(5,'p6')+ph(6,'p7')+'</div></div>';
  }else if(S.idx<STEPS.length){
    var st=STEPS[S.idx];
    h=dots()+'<div class="q" key="'+S.idx+'"><h2>'+st.t+'</h2><p class="sub">Question '+(act().indexOf(S.idx)+1)+'</p><div class="grid">'+
      st.o.map(function(o,j){return '<button class="opt'+(S.picks[S.idx]==j?' on':'')+'" data-j="'+j+'"><span class="e">'+o[0]+'</span><b>'+o[1]+'</b><small>'+o[2]+'</small></button>'}).join('')+
      '</div><div class="nav"><button class="link" id="back">← Back</button><button class="link" id="rand">🎲 Surprise me</button></div></div>';
  }else{
    h=dots()+'<div class="final q"><div class="big" style="font-size:44px">🎁</div><h2>Your Birthday Plan</h2>'+
      '<ul>'+act().map(function(i){var st=STEPS[i],o=st.o[S.picks[i]];return '<li data-e="'+i+'"><span>'+st.k+' · tap to change</span>'+o[0]+' '+o[1]+'</li>'}).join('')+'</ul>'+
      (S.locked?'<p><b>Locked in! 🎉 Can’t wait.</b></p>':'<button class="btn" id="lock">Lock it in! 🔒</button>')+'<p><button class="link" id="reset">Start over</button></p>'+
      '<div id="msg"></div></div>';
  }
  app.innerHTML=h;document.querySelector('main').classList.toggle('wide',S.idx<0);
}
function choose(j){
  S.picks[S.idx]=j;S.locked=false;save();pop(.5,.4,40);render();
  setTimeout(function(){S.idx=nxt(S.idx,1);render();if(S.idx>=STEPS.length)pop(.5,.3,120)},450);
}
app.addEventListener('click',function(e){
  var b=e.target.closest('button,li');if(!b)return;
  if(b.id==='go'){S.idx=0;render();pop(.5,.3,80)}
  else if(b.id==='reset'){S.picks={};S.locked=false;S.idx=-1;save();render();}
  else if(b.id==='back'){var p=nxt(S.idx,-1);S.idx=p<0?-1:p;render()}
  else if(b.id==='rand'){choose(Math.floor(Math.random()*STEPS[S.idx].o.length))}
  else if(b.dataset.j!==undefined){choose(+b.dataset.j)}
  else if(b.dataset.e!==undefined){S.idx=+b.dataset.e;render()}
  else if(b.id==='lock'){
    S.locked=true;save();render();pop(.5,.5,180);
    var t='Happy Birthday '+NAME+'! 🎂 My plan:\n'+act().map(function(i){var st=STEPS[i],o=st.o[S.picks[i]];return st.k+': '+o[0]+' '+o[1]}).join('\n');
    document.getElementById('msg').textContent=t;

});

var cv=document.getElementById('c'),cx=cv.getContext('2d'),P=[],run=false;

function pop(x,y,n){
  var cols=['#2a3fe0','#f2483b','#ffd23f','#a9b6ff','#8fe3c0'];
  for(var i=0;i<n;i++){var a=Math.random()*6.28,v=4+Math.random()*8;
    P.push({x:x*cv.width,y:y*cv.height,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,c:cols[i%5],r:Math.random()*6,s:4+Math.random()*5,l:90})}
  if(!run){run=true;tick()}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(function(p){return p.l>0});
  P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.r+=.2;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  if(P.length)requestAnimationFrame(tick);else run=false;
}
render();
setTimeout(function(){if(S.idx<0)pop(.5,.25,100)},400);
</script>
